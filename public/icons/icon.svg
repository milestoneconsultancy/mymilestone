<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2E5A"/>
      <stop offset="100%" stop-color="#061B36"/>
    </linearGradient>
    <linearGradient id="gradOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C38"/>
      <stop offset="100%" stop-color="#F5741A"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1B8BD8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#gradBg)"/>
  
  <!-- Inner border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Milestone 'M' & Milestone Mountain / Flag emblem -->
  <g transform="translate(64, 72)">
    <!-- Stylized Milestone Path / M Shape -->
    <path d="M 40 340 L 40 100 L 140 250 L 192 170 L 244 250 L 344 100 L 344 340" fill="none" stroke="url(#gradOrange)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Milestone Flag / Star on top peak -->
    <circle cx="192" cy="110" r="28" fill="url(#gradBlue)"/>
    <path d="M 192 60 L 220 75 L 192 90 Z" fill="#F5741A"/>
  </g>

  <!-- Accent dot -->
  <circle cx="410" cy="102" r="16" fill="#F5741A"/>
</svg>
